<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="Morph demo: a photo is dragged out of Finder, shift is held, a white glass wheel of formats appears around the cursor, the HEIC wedge lights up, and photo.heic appears next to the original.">
<style>
  .a { transform-box: view-box; animation-duration: 8s; animation-iteration-count: infinite; animation-fill-mode: both; }
  .cursor { animation-name: cursor; transform: translate(513px, 262px); }
  .cursorfade { animation-name: cursorfade; }
  .ghost { animation-name: ghost; opacity: .62; }
  .key { animation-name: key; transform: translateY(3px); }
  .key .keyface { animation: keyface 8s infinite both; fill: #E4E2DD; }
  .wheelg { animation-name: bloom; transform-origin: 360px 362px; }
  .lift { animation-name: lift; transform: scale(1.06); }
  .liton { animation-name: liton; }
  .litoff { animation-name: litoff; opacity: 0; }
  .pill { animation-name: pill; opacity: 0; }
  .newfile { animation-name: newfile; opacity: 0; }
  @keyframes cursor {
    0%, 7.5% { transform: translate(70px, 720px); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    25%, 32.5% { transform: translate(360px, 362px); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    40%, 88% { transform: translate(513px, 262px); }
    89%, 100% { transform: translate(70px, 720px); }
  }
  @keyframes cursorfade { 0%, 85% { opacity: 1; } 87.5%, 92% { opacity: 0; } 96%, 100% { opacity: 1; } }
  @keyframes ghost { 0%, 7.5% { opacity: 0; } 9%, 51% { opacity: .62; } 52.5%, 100% { opacity: 0; } }
  @keyframes key { 0%, 24.5% { transform: translateY(0); } 25.5%, 51% { transform: translateY(3px); } 52.5%, 100% { transform: translateY(0); } }
  @keyframes keyface { 0%, 24.5% { fill: #FFFFFF; } 25.5%, 51% { fill: #E4E2DD; } 52.5%, 100% { fill: #FFFFFF; } }
  @keyframes bloom {
    0%, 25.5% { opacity: 0; transform: scale(.82); animation-timing-function: cubic-bezier(.2,.9,.25,1); }
    31.5%, 51.25% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(.4,0,1,1); }
    54.5% { opacity: 0; transform: scale(1); }
    100% { opacity: 0; transform: scale(.82); }
  }
  @keyframes lift {
    0%, 39.5% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.9,.25,1); }
    42.5%, 51.25% { transform: scale(1.06); animation-timing-function: cubic-bezier(.2,.9,.25,1); }
    54% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes liton { 0%, 39.5% { opacity: 0; } 41%, 100% { opacity: 1; } }
  @keyframes litoff { 0%, 39.5% { opacity: 1; } 41%, 100% { opacity: 0; } }
  @keyframes pill {
    0%, 55% { opacity: 0; transform: translateY(16px); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    61%, 84.5% { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(.4,0,1,1); }
    88%, 100% { opacity: 0; transform: translateY(16px); }
  }
  @keyframes newfile {
    0%, 57% { opacity: 0; transform: scale(.88); animation-timing-function: cubic-bezier(.2,.9,.25,1); }
    61%, 86% { opacity: 1; transform: scale(1); }
    90%, 100% { opacity: 0; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .a, .key .keyface { animation: none !important; } }
</style>
<defs>
  <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="18"/><feColorMatrix type="saturate" values="1.8"/></filter>
  <filter id="frostsm" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="10"/><feColorMatrix type="saturate" values="1.6"/></filter>
  <filter id="float" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0B2233" flood-opacity=".26" result="a"/>
    <feDropShadow in="a" dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".14"/></filter>
  <filter id="floatsm" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2233" flood-opacity=".2" result="a"/>
    <feDropShadow in="a" dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".12"/></filter>
  <filter id="liftshadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5A2A00" flood-opacity=".32"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF" stop-opacity=".62"/><stop offset=".5" stop-color="#FFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".6" stop-color="#0B2233" stop-opacity="0"/><stop offset="1" stop-color="#0B2233" stop-opacity=".09"/></linearGradient>
  <linearGradient id="rimlight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF" stop-opacity="1"/><stop offset=".55" stop-color="#FFF" stop-opacity=".25"/>
    <stop offset="1" stop-color="#FFF" stop-opacity=".7"/></linearGradient>
  <linearGradient id="wedgesheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF" stop-opacity=".45"/><stop offset=".6" stop-color="#FFF" stop-opacity="0"/></linearGradient>
  <filter id="winshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".14"/></filter>
</defs>
